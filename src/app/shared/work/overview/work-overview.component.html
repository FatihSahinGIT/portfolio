<div id="work" class="work-overview__list mb-12 grid grid-cols-4 gap-3 md:grid-cols-12">
  @for (project of projects; track project.company) {
    <figure [class]="project.images.overview.figureClass">
      <a [routerLink]="['/work', project.company]" class="group block outline-none">
        <div [class]="project.images.overview.imageContainerClass">
          <img
            [src]="project.images.landingpage?.url ?? project.images.overview.url"
            [attr.srcset]="
              getSrcset(project.images.landingpage?.srcset ?? project.images.overview.srcset)
            "
            [attr.sizes]="
              project.images.landingpage?.sizes ?? project.images.overview.sizes ?? null
            "
            [alt]="project.images.landingpage?.alt ?? project.images.overview.alt ?? ''"
            [class]="project.images.landingpage?.imageClass ?? project.images.overview.imageClass"
          />
        </div>

        <figcaption class="flex justify-between py-3 text-sm font-light">
          <span class="transition-underline hover:underline">
            {{ project.images.landingpage?.figcaption ?? project.images.overview.figcaption }}
          </span>
          <span class="transition-underline hover:underline">
            {{ project.name }}
          </span>
        </figcaption>
      </a>
    </figure>
  }
</div>
