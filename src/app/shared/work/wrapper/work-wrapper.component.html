<div>
  <section class="work-wrapper mt-20 grid h-max grid-cols-4 gap-x-10 md:grid-cols-12">
    <work-information
      class="col-span-full md:col-span-8"
      [projectName]="projectSignal()?.project"
      [clientName]="projectSignal()?.name"
      [projectDate]="projectSignal()?.year"
      [roleName]="projectSignal()?.role"
      [projectUrl]="projectSignal()?.url"
    />

    <work-images class="col-span-full my-10 md:col-span-9" [images]="projectSignal()?.images" />

    <work-text
      class="col-span-full my-10 md:col-span-4 md:col-start-10"
      [text]="projectSignal()?.texts?.introduction"
    />

    <work-details
      class="col-span-full my-10"
      [headline]="'Task'"
      [text]="projectSignal()?.texts?.task"
    ></work-details>

    <work-details
      class="col-span-full my-10"
      [headline]="'Outcome'"
      [text]="projectSignal()?.texts?.outcome"
    ></work-details>
  </section>
</div>
