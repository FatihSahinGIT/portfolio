<div>
  <section class="work-wrapper mb-20 grid grid-cols-4 gap-4 md:mt-10 md:grid-cols-12">
    <work-information
      class="col-span-full"
      [projectName]="projectSignal()?.project"
      [clientName]="projectSignal()?.name"
      [projectDate]="projectSignal()?.year"
      [roleName]="projectSignal()?.role"
      [projectUrl]="projectSignal()?.url"
    />

    <work-images class="col-span-full" [image]="projectSignal()?.images" />

    <work-text class="col-span-full" [text]="projectSignal()?.texts?.introduction" />

    <work-collage
      class="work-project-collage__wrapper col-span-full grid grid-cols-subgrid gap-y-4"
      [images]="projectSignal()?.images"
    />

    <work-details
      class="col-span-full lg:col-span-6"
      [headline]="'Task'"
      [text]="projectSignal()?.texts?.task"
    ></work-details>

    <work-details
      class="col-span-full lg:col-span-6"
      [headline]="'Outcome'"
      [text]="projectSignal()?.texts?.outcome"
    ></work-details>
  </section>
</div>
