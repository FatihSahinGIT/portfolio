<section class="work-information">
  <header class="work-information__header flex flex-col xs:w-full lg:w-max">
    <h1 class="font-light">{{ projectName }}</h1>
    <h2 class="font-light text-gray-600">{{ clientName }}</h2>
  </header>

  <div class="work-information__date mt-6">
    <dl class="work-information__date-list m-0 flex justify-between gap-3 xs:flex-col md:flex-row">
      <div class="work-information__date-item flex flex-col">
        <dt class="mb-2 text-sm tracking-tight text-gray-500">Year</dt>
        <dd class="text-base">
          <time datetime="2024-01">{{ projectDate }}</time>
        </dd>
      </div>

      <div class="work-information__date-item flex flex-col">
        <dt class="mb-2 text-sm tracking-tight text-gray-500">Position</dt>
        <dd class="text-base">{{ roleName }}</dd>
      </div>

      <div class="work-information__date-item flex flex-col">
        <dt class="mb-2 text-sm tracking-tight text-gray-500">Website</dt>
        <dd class="text-base">
          <a href="{{ projectUrl }}" target="_blank">{{ projectUrl }}</a>
        </dd>
      </div>
    </dl>
  </div>
</section>
