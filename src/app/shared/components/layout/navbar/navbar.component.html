<nav
    class="mx-8 my-4 mb-8 flex items-center justify-between"
    aria-label="Main navigation"
>
    <a
        href="/"
        aria-label="Home - Portfolio"
        class="inline-flex"
        (click)="navigate($event, '/')"
    >
        <img [src]="logoSrc()" alt="Portfolio Logo" class="h-8 md:h-12" />
    </a>

    <ul class="flex items-center xs:gap-2 md:gap-8">
        <li><a href="/about" (click)="navigate($event, '/about')">About</a></li>
        <li><a href="/work" (click)="navigate($event, '/work')">Work</a></li>

        <li><a href="mailto:sahinspostfach@gmail.com">Contact</a></li>
        <li>
            <button
                type="button"
                (click)="toggleTheme()"
                [attr.aria-label]="
                    isDarkMode()
                        ? 'Switch to light mode'
                        : 'Switch to dark mode'
                "
                class="flex cursor-pointer items-center justify-center p-2"
            >
                <ng-icon
                    [name]="
                        isDarkMode() ? 'bootstrapSunFill' : 'bootstrapMoonFill'
                    "
                    aria-hidden="true"
                />
            </button>
        </li>
    </ul>
</nav>
